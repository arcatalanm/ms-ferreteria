spring.profiles.active=dev
server.port=8081
spring.application.name=ms-inventario

spring.datasource.url=jdbc:mysql://localhost:3306/ferrefixinv
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# ACTUATOR - Health Checks
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ============================================================
# LOGS
# ============================================================
logging.file.name=ms_inventario/logs/inventario.log
logging.pattern.file=%d{HH:mm:ss} %-5level %msg%n
logging.level.org.springframework.cloud=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

api.gateway.url=http://localhost:8080

# ============================================================
# SWAGGER / OPENAPI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.hateoas.enabled=false
spring.autoconfigure.exclude=org.springdoc.core.configuration.SpringDocHateoasConfiguration
