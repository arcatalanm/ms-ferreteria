server:
  port: 8080 # Puerto estándar de interacción

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    urls:
      - name: Autenticación (ms-auth)
        url: /auth/v3/api-docs
      - name: Usuarios (ms-usuarios)
        url: /api/usuarios/v3/api-docs
      - name: Inventario (ms-inventario)
        url: /api/inventario/v3/api-docs
      - name: Ventas (ms-ventas)
        url: /api/ventas/v3/api-docs
      - name: Proveedores (ms-proveedores)
        url: /api/proveedores/v3/api-docs
      - name: Direcciones (ms-direcciones)
        url: /api/direcciones/v3/api-docs
      - name: Marcas (ms-marcas)
        url: /api/marcas/v3/api-docs
      - name: Arriendos (ms-arriendo)
        url: /api/arriendos/v3/api-docs
      - name: Compras (ms-compras)
        url: /api/compras/v3/api-docs
      - name: Sugerencias (ms-sugerencia)
        url: /api/sugerencias/v3/api-docs
      - name: Reportes (ms-reportes)
        url: /api/reportes/v3/api-docs

spring:
  main:
    web-application-type: reactive # Obliga a correr en un servidor Netty

  security:
    oauth2:
      resourceserver:
        jwt:
        # Clave secreta para la autenticacion de los tokens (minimo 32 caracteres para HS256)
          secret-key: "FerreFix_Secure_JWT_Secret_Key_2024_!@#"

  cloud:
    gateway:
      routes:
        # URI (Identificador Universal de Recursos)
        - id: ms-auth
          uri: ${MS_AUTH_URI:http://localhost:8092}
          predicates:
            - Path=/auth/**

        - id: ms-usuarios
          uri: ${MS_USUARIOS_URI:http://localhost:8082}
          predicates:
            - Path=/api/usuarios/**

        - id: ms-inventario
          uri: ${MS_INVENTARIO_URI:http://localhost:8081}
          predicates:
            - Path=/api/inventario/**

        - id: ms-ventas
          uri: ${MS_VENTAS_URI:http://localhost:8083}
          predicates:
            - Path=/api/ventas/**

        - id: ms-proveedores
          uri: ${MS_PROVEEDORES_URI:http://localhost:8084}
          predicates:
            - Path=/api/proveedores/**

        - id: ms-direcciones
          uri: ${MS_DIRECCIONES_URI:http://localhost:8085}
          predicates:
            - Path=/api/direcciones/**
    
        - id: ms-marcas
          uri: ${MS_MARCAS_URI:http://localhost:8086}
          predicates:
            - Path=/api/marcas/**

        - id: ms-arriendo
          uri: ${MS_ARRIENDO_URI:http://localhost:8087}
          predicates:
            - Path=/api/arriendos/**

        - id: ms-compras
          uri: ${MS_COMPRAS_URI:http://localhost:8088}
          predicates:
            - Path=/api/compras/**

        - id: ms-sugerencia
          uri: ${MS_SUGERENCIA_URI:http://localhost:8089}
          predicates:
            - Path=/api/sugerencias/**

        - id: ms-reportes
          uri: ${MS_REPORTES_URI:http://localhost:8090}
          predicates:
            - Path=/api/reportes/**
