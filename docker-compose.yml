services:
  # DATABASE SERVICE (Unified for all microservices)
  db-ferrefix:
    image: mysql:8.0
    container_name: ferrefix-db
    environment:
      MYSQL_ROOT_PASSWORD: iha3gaFBMMzwiee8
    ports:
      - "3306:3306"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - ferrefix-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-piha3gaFBMMzwiee8"]
      interval: 5s
      timeout: 5s
      retries: 10

  # EL GATEWAY
  api-gateway:
    build: ./api-gateway
    container_name: ferrefix-gateway
    ports:
      - "8080:8080"
    environment:
      - MS_AUTH_URI=http://ferrefix-ms-auth:8092
      - MS_USUARIOS_URI=http://ms-usuarios:8082
      - MS_INVENTARIO_URI=http://ms-inventario:8081
      - MS_VENTAS_URI=http://ms-ventas:8083
      - MS_PROVEEDORES_URI=http://ms-proveedores:8084
      - MS_DIRECCIONES_URI=http://ms-direcciones:8085
      - MS_MARCAS_URI=http://ms-marcas:8086
      - MS_ARRIENDO_URI=http://ms-arriendo:8087
      - MS_COMPRAS_URI=http://ms-compras:8088
      - MS_SUGERENCIA_URI=http://ms-sugerencia:8089
      - MS_REPORTES_URI=http://ms-reportes:8090
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx256m -XX:ActiveProcessorCount=1
    deploy:
      resources:
        limits:
          memory: 384M
    restart: on-failure

  # MICROSERVICIO: INVENTARIO
  ms-inventario:
    build: ./ms_inventario
    container_name: ferrefix-ms-inventario
    depends_on:
      db-ferrefix:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-ferrefix:3306/ferrefixinv
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=iha3gaFBMMzwiee8
      - API_GATEWAY_URL=http://api-gateway:8080
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx256m -XX:ActiveProcessorCount=1
    deploy:
      resources:
        limits:
          memory: 384M
    restart: on-failure

  # MICROSERVICIO: USUARIOS
  ms-usuarios:
    build: ./ms_usuarios
    container_name: ferrefix-ms-usuarios
    depends_on:
      db-ferrefix:
        condition: service_healthy
    ports: 
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-ferrefix:3306/ferrefixusr
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=iha3gaFBMMzwiee8
      - API_GATEWAY_URL=http://api-gateway:8080
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx256m -XX:ActiveProcessorCount=1
    deploy:
      resources:
        limits:
          memory: 384M
    restart: on-failure

  # MICROSERVICIO: VENTAS
