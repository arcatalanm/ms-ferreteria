# ============================================================
# FERREFIX MICROSERVICIOS - ORQUESTACIÓN COMPLETA
# ============================================================
# Nota: Se eliminó la etiqueta 'version' porque ya es obsoleta en Docker Compose moderno.

services:

  # ============================================================
  # EUREKA SERVER - Service Discovery
  # ============================================================
  eureka-server:
    image: ms-ferreteria/eureka-server:latest
    build: ./ms_eureka_server  # <-- RUTA PARA COMPILAR
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - ferrefix-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # API GATEWAY - Punto de entrada único
  # ============================================================
  api-gateway:
    image: ms-ferreteria/api-gateway:latest
    build: ./ms-gateway          # <-- RUTA PARA COMPILAR
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - ferrefix-net
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ============================================================
  # MS-INVENTARIO
  # ============================================================
  ms-inventario:
    image: ms-ferreteria/ms-inventario:latest
    build: ./ms_inventario       # <-- RUTA PARA COMPILAR
    container_name: ms-inventario
    ports:
      - "8001:8001"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8001
      - SPRING_APPLICATION_NAME=ms-inventario
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-inventario:3306/ferrefix_inventario?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=ferrefix_user
      - SPRING_DATASOURCE_PASSWORD=ferrefix_pass
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - ferrefix-net
    depends_on:
      mysql-inventario:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mysql-inventario:
    image: mysql:8.0
    container_name: mysql-inventario
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=ferrefix_inventario
      - MYSQL_USER=ferrefix_user
      - MYSQL_PASSWORD=ferrefix_pass
    networks:
      - ferrefix-net
    volumes:
      - mysql-inventario-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # MS-USUARIOS
  # ============================================================
  ms-usuarios:
    image: ms-ferreteria/ms-usuarios:latest
    build: ./ms_usuarios         # <-- RUTA PARA COMPILAR
