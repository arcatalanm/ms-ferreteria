      - SPRING_DATASOURCE_URL=jdbc:mysql://db-ferrefix:3306/ferrefixventas
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=iha3gaFBMMzwiee8
      - API_GATEWAY_URL=http://api-gateway:8080
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx256m -XX:ActiveProcessorCount=1
    deploy:
      resources:
        limits:
          memory: 384M
    restart: on-failure

  # MICROSERVICIO: PROVEEDORES
