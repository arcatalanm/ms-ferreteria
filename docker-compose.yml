services:
  # EL GATEWAY
  ms-gateway:
    build: ./api-gateway
    container_name: ferrefix-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_GATEWAY_ROUTES_0_URI=http://ms-usuarios:8082
      - SPRING_CLOUD_GATEWAY_ROUTES_1_URI=http://ms-inventario:8081
      - SPRING_CLOUD_GATEWAY_ROUTES_2_URI=http://ms-ventas:8083
      - SPRING_CLOUD_GATEWAY_ROUTES_3_URI=http://ms-proveedores:8084
      - SPRING_CLOUD_GATEWAY_ROUTES_4_URI=http://ms-direcciones:8085
      - SPRING_CLOUD_GATEWAY_ROUTES_5_URI=http://ms-marcas:8086
      - SPRING_CLOUD_GATEWAY_ROUTES_6_URI=http://ms-arriendo:8087
      - SPRING_CLOUD_GATEWAY_ROUTES_7_URI=http://ms-compras:8088
      - SPRING_CLOUD_GATEWAY_ROUTES_8_URI=http://ms-sugerencia:8089
      - SPRING_CLOUD_GATEWAY_ROUTES_9_URI=http://ms-reportes:8090
      - SPRING_CLOUD_GATEWAY_ROUTES_10_URI=http://ms-reportes:8090
      - SPRING_CLOUD_GATEWAY_ROUTES_11_URI=http://ms-reportes:8090
      - SPRING_CLOUD_GATEWAY_ROUTES_12_URI=http://ms-notificaciones:8091

  # MICROSERVICIO: INVENTARIO
  db-inventario:
    image: mysql:8.0
    container_name: ferrefix-db-inventario
    environment:
      MYSQL_ROOT_PASSWORD: iha3gaFBMMzwiee8
      MYSQL_DATABASE: ferrefixinv
    ports:
      - "3312:3306"
  ms-inventario:
    build: ./ms_inventario
    container_name: ferrefix-ms-inventario
    depends_on:
      - db-inventario
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-inventario:3306/ferrefixinv
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=iha3gaFBMMzwiee8
      - API_GATEWAY_URL=http://ms-gateway:8080
    restart: on-failure

  # MICROSERVICIO: USUARIOS
  db-usuarios:
    image: mysql:8.0
    container_name: ferrefix-db-usuarios
    environment:
      MYSQL_ROOT_PASSWORD: iha3gaFBMMzwiee8
      MYSQL_DATABASE: ferrefixusr
    ports:
      - "3310:3306"
  ms-usuarios:
    build: ./ms_usuarios
    container_name: ferrefix-ms-usuarios
    depends_on:
      - db-usuarios
    ports: 
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-usuarios:3306/ferrefixusr
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=iha3gaFBMMzwiee8
