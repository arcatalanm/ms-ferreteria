      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mysql-ventas:
    image: mysql:8.0
    container_name: mysql-ventas
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=ferrefix_ventas
      - MYSQL_USER=ferrefix_user
      - MYSQL_PASSWORD=ferrefix_pass
    networks:
      - ferrefix-net
    volumes:
      - mysql-ventas-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
