      - SPRING_DATASOURCE_PASSWORD=ferrefix_pass
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - ferrefix-net
    depends_on:
      mysql-usuarios:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mysql-usuarios:
    image: mysql:8.0
    container_name: mysql-usuarios
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=ferrefix_usuarios
      - MYSQL_USER=ferrefix_user
      - MYSQL_PASSWORD=ferrefix_pass
    networks:
      - ferrefix-net
    volumes:
      - mysql-usuarios-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # MS-VENTAS
