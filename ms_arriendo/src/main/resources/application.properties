spring.application.name=ms_arriendo
server.port=8087

spring.datasource.url=jdbc:mysql://localhost:3306/ferrefixarriendo
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

logging.file.name=ms_arriendo/logs/arriendo.log
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
logging.pattern.file=%d{HH:mm:ss} %-5level %msg%n

api.gateway.url=http://ms-gateway:8080
